<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EASEL-1 · FM1 Screen Prototype</title>
<style>
:root{--paper:#f1eee3;--silver:#c9c9c2;--blue:#174f91;--blue2:#2868a5;--red:#c93636;--ink:#17263a;--muted:#66717c;--orange:#e87524;--yellow:#e6c43a;--purple:#8056a2;--white:#fffdf5;--line:#aab2b8}
*{box-sizing:border-box}body{margin:0;background:#d5d2c9;color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
.wrap{max-width:540px;margin:0 auto}.intro{margin:0 auto 14px;max-width:540px}.intro h1{font-size:22px;letter-spacing:.12em;margin:0 0 4px;color:var(--blue)}.intro p{margin:0;color:#4d5963;font-size:13px}
.device{background:linear-gradient(145deg,#f8f7f1,#bfc2c1);border:1px solid #8c9294;border-radius:24px;padding:16px;box-shadow:0 12px 28px #0003,inset 0 1px #fff}
.screen{width:min(100%,420px);aspect-ratio:1/1;margin:auto;background:var(--paper);border:7px solid #272b30;border-radius:7px;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #fff}
.lcd-top{height:21%;padding:7px 9px 5px;background:linear-gradient(120deg,#f8f7f0,#d8d8d1);display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #a6a8a4}
.brand{font-size:10px;font-weight:900;font-style:italic;letter-spacing:.06em;color:var(--blue);line-height:1.05}.brand b{display:block;font-size:15px;letter-spacing:.08em}
.page-title{text-align:right;font-size:11px;font-weight:900;font-style:italic;color:var(--blue);letter-spacing:.045em;max-width:68%}.dots{display:flex;gap:4px;justify-content:flex-end;margin-top:5px}.dots i{width:5px;height:5px;border-radius:50%;background:#9ba7b2}.dots i.on{background:var(--red)}
.content{position:relative;flex:1;min-height:0;padding:8px 9px 5px;background:linear-gradient(#f3f0e6,#e6e4da);overflow:hidden}
.patch-row{display:flex;align-items:center;justify-content:space-around;gap:4px;margin:2px 0 8px}.socket{width:15px;height:15px;border-radius:50%;background:#242a31;border:3px solid var(--socket);box-shadow:inset 0 0 0 2px #e5e5df,0 1px 1px #0004;position:relative}.socket:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#242a31;left:3px;top:3px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.control{min-width:0}.knob{width:32px;height:32px;margin:0 auto 4px;border-radius:50%;border:2px solid #26313d;background:radial-gradient(circle at 35% 30%,#fff9 0 8%,transparent 9%),linear-gradient(135deg,var(--knob),color-mix(in srgb,var(--knob),#111 30%));box-shadow:0 2px 2px #0005,inset 0 1px #fff9;position:relative}.knob:before{content:"";position:absolute;width:2px;height:8px;background:#fff;top:3px;left:13px;border-radius:2px}.knob:after{content:"";position:absolute;inset:5px;border:1px solid #fff5;border-radius:50%}
.ctrl-name{font-size:8px;font-weight:800;line-height:1.05;text-transform:uppercase;display:block;min-height:17px;color:#26384c}.ctrl-value{font-size:10px;font-weight:900;color:var(--blue);display:block}.selectable{cursor:pointer;border-radius:4px;padding:2px 0}.selectable.selected{outline:1px solid var(--red);background:#fff8}
.slider-row{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:9px;font-weight:800}.slider-row span{width:52px}.slider{height:5px;flex:1;background:#b7bdc0;border:1px solid #8a9297;position:relative}.slider i{display:block;height:100%;background:var(--blue2)}.slider em{position:absolute;top:-4px;width:7px;height:11px;background:var(--red);border:1px solid #812020;transform:translateX(-50%)}
.blue-band{background:linear-gradient(90deg,#16477e,#2369a8);color:#fff;padding:5px 8px 6px;min-height:19%;display:flex;align-items:center;justify-content:space-around;gap:4px;text-align:center;border-top:2px solid #f7f4e9}
.band-item{min-width:0;flex:1}.band-item small{display:block;font-size:7px;letter-spacing:.06em;font-weight:800;opacity:.85}.band-item strong{display:block;font-size:12px;line-height:1.15}
.keys{height:13%;display:grid;grid-template-columns:repeat(16,1fr);gap:2px;background:var(--red);padding:3px 4px 4px;border-top:2px solid #9d2528}.key{background:linear-gradient(#fff,#eeeae0);border:1px solid #b9b8b0;border-radius:0 0 2px 2px;box-shadow:inset 0 -2px #d6d3ca}.key.active{background:var(--yellow);border-color:#8e6e12}.key.red{background:#f5eeee;border-top:3px solid #c93636}
.hardware{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:420px;margin:13px auto 0}.hw-group{display:flex;gap:6px}.hw{border:1px solid #777;background:linear-gradient(#f8f8f5,#b8b9b7);color:#202832;border-radius:50%;width:36px;height:36px;font-size:9px;font-weight:900;box-shadow:0 2px 2px #0004;touch-action:manipulation}.hw:active,.hw.on{background:var(--blue);color:white}.hw-label{font-size:9px;color:#535d66;text-align:center;margin-top:4px}
.nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px auto 0;max-width:420px}.nav button,.action{border:1px solid #5c6872;background:#ecebe5;color:#243447;padding:7px 9px;border-radius:4px;font-size:10px;font-weight:800}.nav button.active,.action.primary{background:var(--blue);color:white}.hint{text-align:center;color:#59636c;font-size:11px;margin:10px 0 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 0}.step{height:31px;border:1px solid #a9afb1;background:#f9f7ef;color:#344252;font-size:10px;font-weight:800;border-radius:2px}.step.on{background:#d8e4f1;border-color:var(--blue)}.step.accent{border:2px solid var(--red)}.step.play{background:var(--yellow)}
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.rowitem{border:1px solid #adb4b5;padding:5px;font-size:9px;font-weight:800;background:#f8f6ee}.rowitem b{color:var(--blue);float:right}
.switches{display:flex;gap:8px;justify-content:center;margin:5px 0}.switch{border:1px solid #a3a8a8;background:#e7e5dc;padding:4px 7px;font-size:9px;font-weight:900}.switch.on{background:var(--yellow);border-color:#947a21}
@media(max-width:420px){body{padding:8px}.device{padding:8px;border-radius:16px}.screen{border-width:5px}.knob{width:27px;height:27px}.knob:before{left:10px}.ctrl-name{font-size:7px}.ctrl-value{font-size:9px}.blue-band{min-height:18%}.band-item strong{font-size:10px}.keys{height:12%}}
</style></head><body>
<div class="wrap"><div class="intro"><h1>EASEL-1 · FM1 DISPLAY STUDY</h1><p>Interactive 240 × 240 screen concept. Select a page, then choose a knob and use the FM1-style encoder controls below.</p></div>
<div class="device"><div class="screen" aria-label="240 by 240 FM1 display">
<div class="lcd-top"><div class="brand">FM1<b>EASEL-1</b></div><div><div class="page-title" id="title">HOME · VOICE</div><div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div></div></div>
<div class="content" id="content"></div><div class="blue-band" id="band"></div><div class="keys" id="keys"></div>
</div>
<div class="hardware"><div class="hw-group"><button class="hw" id="prev" aria-label="Previous page">◀</button><button class="hw" id="next" aria-label="Next page">▶</button></div><div class="hw-group"><button class="hw" id="minus">−</button><button class="hw" id="plus">+</button><button class="hw" id="push">OK</button></div></div>
<div class="hw-label">PAGE / SELECT &nbsp;&nbsp;&nbsp;&nbsp; ENCODER 1–4 · TURN / PRESS</div>
</div>
<div class="nav" id="nav"></div><p class="hint" id="hint">Choose a page or use ◀ / ▶. Select a parameter, then turn the encoder.</p></div>
<script>
(()=>{'use strict';
const palette={blue:'#2868a5',orange:'#e87524',yellow:'#e6c43a',purple:'#8056a2',red:'#c93636'};
const pages=[
{title:'HOME · VOICE',sub:'EASEL WOODY PLUCK',controls:[['SHAPE','TRI', 'orange'],['TIMBRE','18%', 'yellow'],['FOLD','32%','blue'],['LPG','220ms','orange']],sockets:['blue','orange','purple','yellow','white'],band:[['PATCH','01'],['LEVEL','78%'],['TUNE','A2'],['MODE','LPG']],hint:'Play from HOME. The four encoders are your immediate sound controls.'},
{title:'OSC · COMPLEX',sub:'PRIMARY + MODULATOR',controls:[['WAVE','TRI','orange'],['MOD PITCH','+7st','blue'],['FM AMT','24%','yellow'],['SUB','8%','purple']],sockets:['orange','blue','yellow','purple'],band:[['FREQ','110Hz'],['RATIO','2.00×'],['FM','24%'],['SUB','8%']],hint:'Oscillator page: primary waveform, modulator pitch, FM index and sub level.'},
{title:'FOLD · TIMBRE',sub:'WAVEFOLDER',controls:[['FOLD','38%','orange'],['SYMM','−12%','blue'],['TIMBRE','26%','yellow'],['DRIVE','8%','orange']],sockets:['orange','purple','yellow','white'],band:[['FOLD','38%'],['BIAS','−12%'],['PRE','26%'],['DRIVE','8%']],hint:'Pre-folder timbre and symmetry are separate controls, just like the concept spec.'},
{title:'ENV · LPG',sub:'CONTOUR GENERATOR',controls:[['ATTACK','4ms','orange'],['DECAY','220ms','orange'],['VACTROL','62%','yellow'],['DRONE','OFF','blue']],sockets:['orange','blue','yellow','white'],band:[['MODE','LPG'],['RISE','4ms'],['FALL','220ms'],['DRONE','OFF']],hint:'LPG is the default. VCA and filter-only modes are available as alternatives.'},
{title:'LFO · MOD',sub:'MODULATION SOURCES',controls:[['RATE','0.30Hz','blue'],['SHAPE','SINE','blue'],['AMOUNT','18%','yellow'],['DEST','FOLD','purple']],sockets:['blue','purple','yellow','white'],band:[['SOURCE','LFO'],['RATE','0.30Hz'],['DEPTH','18%'],['DEST','FOLD']],hint:'A compact modulation matrix. More destinations can be selected from the parameter list.'},
{title:'FX · CHARACTER',sub:'FILTER COLOURS',controls:[['MODEL','MS-20','purple'],['CUTOFF','3.6k','blue'],['RES','24%','yellow'],['DRIVE','18%','orange']],sockets:['purple','blue','yellow','orange'],band:[['TYPE','MS-20 LP'],['CUTOFF','3.6kHz'],['RES','24%'],['DRIVE','18%']],hint:'Easel LPG remains the voice default. MS-20, ladder and Oberheim are optional colours.'},
{title:'SEQ · 16 STEP',sub:'PITCH / GATE / ACCENT',controls:[['TEMPO','108','yellow'],['DIV','1/16','blue'],['SWING','0%','orange'],['LENGTH','55%','purple']],sockets:['yellow','blue','orange','purple'],band:[['TEMPO','108'],['CLOCK','1/16'],['SWING','0%'],['LENGTH','55%']],hint:'Sixteen steps fit as a 4 × 4 grid. Select a step to edit it; four encoders edit its values.'},
{title:'DRUMS · VOICE 1',sub:'INDEPENDENT PATCH',controls:[['PITCH DROP','18st','orange'],['BODY','38%','blue'],['DECAY','210ms','yellow'],['STRIKE','24%','purple']],sockets:['orange','blue','yellow','purple'],band:[['VOICE','BONGO'],['PATCH','OWN'],['LEVEL','78%'],['PATTERN','A']],hint:'Each drum voice owns a full synth patch plus its own drum-specific controls.'},
{title:'PRESETS · MEMORY',sub:'PATCH MANAGEMENT',controls:[['LOAD','01','blue'],['SAVE','—','orange'],['COPY','—','yellow'],['NAME','EDIT','purple']],sockets:['blue','orange','yellow','purple'],band:[['BANK','USER'],['SLOT','01'],['PATCH','WOODY'],['STATE','READY']],hint:'Preset operations use the FM1 controls; patch names and values remain readable.'}
];
let page=0,selected=0,step=0,stepGate=Array.from({length:16},(_,i)=>i%2===0),stepAccent=Array.from({length:16},(_,i)=>i===0||i===8),values={};
const $=id=>document.getElementById(id);
function draw(){const p=pages[page];$('title').textContent=p.title;$('dots').innerHTML=pages.map((_,i)=>'<i class="'+(i===page?'on':'')+'"></i>').join('');$('nav').innerHTML=pages.map((x,i)=>'<button data-page="'+i+'" class="'+(i===page?'active':'')+'">'+String(i+1).padStart(2,'0')+'</button>').join('');
$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;selected=0;draw()});
let html='<div style="display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:900;color:#174f91"><span>'+p.sub+'</span><span>EDIT '+(selected+1)+'/4</span></div>';
if(page===6){html+='<div class="steps">'+stepGate.map((on,i)=>'<button class="step '+(on?'on ':'')+(stepAccent[i]?'accent ':'')+(i===step?'play':'')+'" data-step="'+i+'">'+(i+1)+'</button>').join('')+'</div><div style="font-size:8px;color:#536273;text-align:center">BLUE = GATE &nbsp; RED EDGE = ACCENT &nbsp; YELLOW = SELECTED</div>'}
else if(page===8){html+='<div class="rows">'+[['01','Easel Woody Pluck'],['02','Hollow MS-20'],['03','Buchla Bongo'],['04','West Coast Steps']].map((x,i)=>'<div class="rowitem" style="'+(i===selected?'background:#f5e8ac;border-color:#b58c1b':'')+'">'+x[0]+' · '+x[1]+' <b>'+(i===selected?'▶':'')+'</b></div>').join('')+'</div>'}
else if(page===7){html+='<div class="rows">'+[['BD','BASS DRUM'],['SD','SNARE'],['TM','TOM'],['NO','NOISE']].map((x,i)=>'<div class="rowitem" style="'+(i===selected?'background:#f5e8ac;border-color:#b58c1b':'')+'">'+x[0]+' · '+x[1]+' <b>'+(i===selected?'EDIT':'')+'</b></div>').join('')+'</div>'}
else{html+='<div class="patch-row">'+p.sockets.map(c=>'<i class="socket" style="--socket:'+(c==='white'?'#f8f7ee':palette[c])+'"></i>').join('')+'</div><div class="controls">'+p.controls.map((c,i)=>'<div class="control selectable '+(selected===i?'selected':'')+'" data-knob="'+i+'"><div class="knob" style="--knob:'+palette[c[2]]+'"></div><span class="ctrl-name">'+c[0]+'</span><span class="ctrl-value">'+(values[page+'-'+i]||c[1])+'</span></div>').join('')+'</div>';
if(page===3||page===5||page===2){html+='<div style="margin-top:5px">'+[['RISE','4ms'],['FALL','220ms']].slice(0,page===3?2:1).map((x,i)=>'<div class="slider-row"><span>'+x[0]+'</span><div class="slider"><i style="width:'+(i?60:20)+'%"></i><em style="left:'+(i?60:20)+'%"></em></div><b>'+x[1]+'</b></div>').join('')+'</div>'}
}
$('content').innerHTML=html;$('content').querySelectorAll('[data-knob]').forEach(el=>el.onclick=()=>{selected=+el.dataset.knob;draw()});
$('content').querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{step=+el.dataset.step;selected=step%4;draw()});
$('band').innerHTML=p.band.map(x=>'<div class="band-item"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');
$('keys').innerHTML=Array.from({length:16},(_,i)=>'<div class="key '+(i===step&&page===6?'active':'')+(i%4===0?' red':'')+'"></div>').join('');
$('hint').textContent=p.hint;
}
function movePage(n){page=(page+n+pages.length)%pages.length;selected=0;draw()}
function turn(dir){const p=pages[page];if(page===6){if(selected===0){const v=+(values['tempo']||108)+dir;values.tempo=Math.max(50,Math.min(180,v));p.band[0][1]=values.tempo}else if(selected===1){p.band[1][1]=dir>0?'1/8':'1/16'}else if(selected===2){const v=Math.max(0,Math.min(100,+(values.swing||0)+dir));values.swing=v;p.band[2][1]=v+'%'}else{const v=Math.max(10,Math.min(100,+(values.length||55)+dir*5));values.length=v;p.band[3][1]=v+'%'}}else if(page===7){const c=p.controls[selected];const v=parseInt((values[page+'-'+selected]||c[1]),10)||0;values[page+'-'+selected]=Math.max(0,v+dir*2)+'%'}else if(page===8){selected=(selected+dir+4)%4}else{const c=p.controls[selected],key=page+'-'+selected;let v=values[key]||c[1];if(/%/.test(v))v=Math.max(0,Math.min(100,(parseInt(v)||0)+dir*2))+'%';else if(/ms/.test(v))v=Math.max(1,(parseInt(v)||1)+dir*5)+'ms';else if(/st/.test(v))v=(parseInt(v)||0)+dir+'st';else if(/Hz|k/.test(v))v=(parseFloat(v)||1)*(dir>0?1.05:.95)+(v.includes('k')?'k':'Hz');else if(/^/.test(v)){}else v=dir>0?'+'+((parseInt(v)||0)+1):String((parseInt(v)||0)-1);values[key]=String(v);p.controls[selected][1]=String(v)}draw()}
$('prev').onclick=()=>movePage(-1);$('next').onclick=()=>movePage(1);$('minus').onclick=()=>turn(-1);$('plus').onclick=()=>turn(1);$('push').onclick=()=>{if(page===6){step=(step+1)%16;selected=step%4}else selected=(selected+1)%4;draw()};
draw();
})();
</script></body></html>
